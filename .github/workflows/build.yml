name: Build Sitara Live APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Create .env if missing
      run: |
        if [ ! -f .env ]; then
          cp .env.example .env 2>/dev/null || touch .env
        fi

    - name: Create debug and release keystores
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        if [ ! -f my-upload-key.jks ]; then
          keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sitara Live,O=Sitara,C=US"
        fi

    - name: Accept Android SDK licenses
      run: |
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78ba6edcb139f6642b\n261485501ad457a82b41057e9c29213b0f7c6cf7" > "$ANDROID_HOME/licenses/android-sdk-license" || true
        echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release and Debug APK
      run: STORE_PASSWORD=android KEY_PASSWORD=android ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

    - name: Upload Sitara Live Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Sitara-Live-Release-APK-v1.1
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Upload Sitara Live Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Sitara-Live-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
